include:
  - remote: 'https://gitlab.wexample.com/wexample-public/ci-cd/-/raw/main/.gitlab-ci.docker.yml'
.checkup_install:
  extends:
    - .on_master
  # Installs read the wexample packages from the GitLab registry
  # (requirements.txt names it), which serves a version as soon as it is out.
  needs:
    - deploy
  script:
    - set -e
    - apt-get update -qq
    - apt-get install -y gnupg2 wget
    - wget -O - https://apt.wexample.com/gpg | gpg --dearmor -o /etc/apt/trusted.gpg.d/wexample.gpg
    - echo "deb http://apt.wexample.com/ stable main" | tee /etc/apt/sources.list.d/wexample.list
    - apt-get update -qq
    - apt-get install -y wex
    - wex hi
    - BUILD_VERSION=$(cat version.txt)
    - INSTALLED_VERSION=$(wex version)
    - echo "Expected ${BUILD_VERSION}, got ${INSTALLED_VERSION}"
    - test "${BUILD_VERSION}" = "${INSTALLED_VERSION}"
    - apt-get remove -y wex
.on_master:
  only:
    - main
  # A release pipeline (WEX_RELEASE) runs the release job alone: the build,
  # deploy and install jobs belong to the pipeline its merge then creates.
  except:
    variables:
      - $WEX_RELEASE == "1"
build_apt:
  extends:
    - .on_master
  # Without waiting for the earlier build_docker_base stage: the base images
  # build beside the package, not before it.
  needs: []
  image: gitlab-docker.wexample.com/wexample/wex/wex-build:build
  script:
    - BUILD_VERSION=$(cat version.txt)
    - mkdir -p /var/tmp/build
    - cp -r .git /var/tmp/build
    - cd /var/tmp/build
    - git fetch && git checkout build
    - ln -s ${CI_PROJECT_DIR} source
    - sudo python3 /var/tmp/build/script/build.py -n wex -gid ${CI_PROJECT_ID} -gtk ${WEX_BUILD_TOKEN} -v ${BUILD_VERSION}
  stage: build_apt
# Ubuntu, as on the workstations. Debian is installed by the image builds
# themselves, which start from it and check the version they get.
checkup_install_ubuntu:
  extends: .checkup_install
  image: ubuntu:24.04
  stage: checkup_install
deploy:
  extends:
    - .on_master
  image: curlimages/curl
  needs:
    - build_apt
  script:
    - BUILD_VERSION=$(cat version.txt)
    - curl --fail "http://151.80.23.108:7654/webhook/app/prod/wex-apt-repo/apt/publish?_token=${WEX_WEBHOOK_TOKEN}&project=${CI_PROJECT_ID}&version=${BUILD_VERSION}&_async=0"
  stage: deploy
stages:
  - release
  - build_docker_base
  - build_apt
  - deploy
  - checkup_install
  - build_docker
  - upgrade_runner
# The base images wex/release and wex/runner are built on: everything but wex,
# tagged with the hash of their Dockerfile. A pipeline builds one only when no
# image holds that tag yet — when its Dockerfile changed — and the image
# builds of every release start from it.
.docker_base_images:
  script:
    - export BASE_REGISTRY="$CI_REGISTRY${CI_REGISTRY_PORT:+:$CI_REGISTRY_PORT}/wexample-public/docker"
    - export RELEASE_BASE_IMAGE="$BASE_REGISTRY/wex/release-base:$(sha256sum .wex/docker/images/Dockerfile.release.base | cut -c1-12)"
    - export RUNNER_BASE_IMAGE="$BASE_REGISTRY/wex/runner-base:$(sha256sum .wex/docker/images/Dockerfile.runner.base | cut -c1-12)"
.docker_build_base_image:
  extends:
    - .on_master
    - .docker_build_legacy_image_file
  stage: build_docker_base
  # Nothing of this pipeline's wex goes in: built while the package is.
  needs: []
  variables:
    IMAGE_NAMESPACE: wexample-public/docker
    # Its tag is its Dockerfile's hash, not the version it was built at.
    IMAGE_TAG_VERSION: "false"
  script:
    - !reference [.docker_base_images, script]
    - export IMAGE_TAG=$(sha256sum "$IMAGE_DOCKERFILE" | cut -c1-12)
    - |
      if docker buildx imagetools inspect "$BASE_REGISTRY/$IMAGE_NAME:$IMAGE_TAG" > /dev/null 2>&1; then
        echo "$IMAGE_NAME:$IMAGE_TAG is already built."
        exit 0
      fi
    - !reference [.docker_build_legacy_image_file, script]
build_docker_release_base:
  extends: .docker_build_base_image
  variables:
    IMAGE_NAME: wex/release-base
    IMAGE_DOCKERFILE: .wex/docker/images/Dockerfile.release.base
    IMAGE_PLATFORMS: linux/amd64,linux/arm64
build_docker_runner_base:
  extends: .docker_build_base_image
  variables:
    IMAGE_NAME: wex/runner-base
    IMAGE_DOCKERFILE: .wex/docker/images/Dockerfile.runner.base
build_docker:
  extends:
    - .on_master
    - .docker_build_legacy_image_file
  stage: build_docker
  # Straight after the apt publication, beside the install check: the build
  # installs the package itself and fails on a version it does not get.
  needs:
    - deploy
    - build_docker_release_base
  variables:
    # Published to the public project so anyone can pull without credentials —
    # the source stays private. Pushing there uses the deploy token in
    # PUBLIC_REGISTRY_USER / PUBLIC_REGISTRY_PASSWORD.
    IMAGE_NAMESPACE: wexample-public/docker
    IMAGE_NAME: wex/release
    IMAGE_DOCKERFILE: .wex/docker/images/Dockerfile.release
    # One image for both, so a Mac on Apple Silicon runs it natively: the
    # Claude CLI the agent images carry crashes under amd64 emulation. The
    # package is architecture-independent and the apt repository publishes it
    # for arm64 too, from the `deploy` job of this same pipeline.
    IMAGE_PLATFORMS: linux/amd64,linux/arm64
  script:
    - export IMAGE_TAG=$(cat version.txt)
    - export IMAGE_EXTRA_TAGS=latest
    - !reference [.docker_base_images, script]
    - export BUILD_OPTIONS="--build-arg WEX_VERSION=${IMAGE_TAG} --build-arg BASE_IMAGE=${RELEASE_BASE_IMAGE}"
    - !reference [.docker_build_legacy_image_file, script]
build_docker_runner:
  extends:
    - .on_master
    - .docker_build_legacy_image_file
  stage: build_docker
  # Straight after the apt publication, beside the install check: the build
  # installs the package itself and fails on a version it does not get.
  needs:
    - deploy
    - build_docker_runner_base
  variables:
    IMAGE_NAMESPACE: wexample-public/docker
    # The GitLab runner the package suites are published from: the official
    # runner image with this wex inside (see the Dockerfile). The runner host
    # is amd64, and the image is only ever pulled there.
    IMAGE_NAME: wex/runner
    IMAGE_DOCKERFILE: .wex/docker/images/Dockerfile.runner
  script:
    - export IMAGE_TAG=$(cat version.txt)
    - export IMAGE_EXTRA_TAGS=latest
    - !reference [.docker_base_images, script]
    - export BUILD_OPTIONS="--build-arg WEX_VERSION=${IMAGE_TAG} --build-arg BASE_IMAGE=${RUNNER_BASE_IMAGE}"
    - !reference [.docker_build_legacy_image_file, script]
# The runner that publishes the suites, recreated on the image just built, so
# the next publication runs this wex. Not from this job itself: recreating the
# runner's container kills whatever job it runs, this one included. It starts
# a container beside it, on the new image, which waits until the runner runs
# no job — no shell job under gitlab-runner, no docker job's container — and
# then restarts the runner app as an operator would.
upgrade_runner:
  extends:
    - .on_master
  stage: upgrade_runner
  needs:
    - build_docker_runner
  tags:
    - suite-publish
  variables:
    GIT_STRATEGY: none
    RUNNER_APP_PATH: /var/www/dev/runner
    RUNNER_CONTAINER: runner_dev_gitlab_runner
  script:
    - docker rm -f runner-upgrade > /dev/null 2>&1 || true
    - |
      docker run --detach --rm --name runner-upgrade \
        --volume /var/run/docker.sock:/var/run/docker.sock \
        --volume /var/www:/var/www \
        --env RUNNER_APP_PATH --env RUNNER_CONTAINER \
        --entrypoint sh \
        gitlab-docker.wexample.com/wexample-public/docker/wex/runner:latest -c '
          busy() {
            docker ps --format "{{.Names}}" | grep -qE "^runner-.*-(build|predefined)" && return 0
            docker exec "$RUNNER_CONTAINER" sh -c "pgrep -P \$(pgrep -f \"gitlab-runner run\" | head -1)" > /dev/null 2>&1
          }
          # Idle twice in a row, a job starting between two checks aside.
          while busy || { sleep 10; busy; }; do sleep 30; done
          cd "$RUNNER_APP_PATH" && wex app::app/restart --pull'
    - echo "The runner is recreated on the new image once it runs no job (container runner-upgrade)."
variables:
  MAIN_BRANCH_NAME: main
# Publishes wex from the runner, as `wex app::release/publish` does on a
# developer's machine, with wex run from this checkout's sources like there:
# the release always uses the code it releases. Started through the API with
# WEX_RELEASE=1 (what the local command does). The checkouts live on the
# runner host, kept between jobs: wex itself, and the Python suite it
# publishes first. Secrets come from the project's protected CI variables.
release:
  stage: release
  tags:
    - suite-publish
  rules:
    - if: '$WEX_RELEASE == "1"'
  resource_group: wex-release
  timeout: 12h
  variables:
    GIT_STRATEGY: none
    WEX_PATH: /var/www/apps/wex
    WEX_REPOSITORY: ssh://git@gitlab.wexample.com:4567/wexample/wex.git
    SUITE_PATH: /var/www/suites/python
    SUITE_REPOSITORY: ssh://git@gitlab.wexample.com:4567/wexample-python/suite-manager.git
    SUITE_BRANCH: main
    # wex's own .venv, shared with the suite, as on a developer's machine:
    # wex's tests look for it there.
    VENV_PATH: /var/www/apps/wex/.venv
  script:
    - set -eu
    # The Python suite's checkout is used by one job at a time: its own
    # publication job (the ci-cd suite template) takes the same lock.
    - exec 8>"$SUITE_PATH.lock"
    - flock 8
    # A developer's umask: the job runs as root, whose 022 makes some tests
    # find their files already at the mode they then expect a change to.
    - umask 0002
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - install -m 600 "$SUITE_PUBLISH_SSH_KEY" ~/.ssh/id_ed25519
    - ssh-keyscan -p 4567 gitlab.wexample.com >> ~/.ssh/known_hosts 2>/dev/null
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
    # The publication checks an agent holds the key, as on a developer's machine.
    # Without the lock's descriptor, which the agent would keep, and the lock
    # with it, long after the job; stopped when the job ends.
    - eval "$(ssh-agent -s 8>&-)" > /dev/null
    - trap 'ssh-agent -k > /dev/null 2>&1 || true' EXIT
    - ssh-add -q ~/.ssh/id_ed25519
    # Through the environment, not ~/.gitconfig: the shell runners of several
    # GitLabs share this container, and two jobs writing that file at once
    # fail on its lock.
    - export GIT_AUTHOR_NAME=wex GIT_COMMITTER_NAME=wex GIT_AUTHOR_EMAIL=contact@wexample.com GIT_COMMITTER_EMAIL=contact@wexample.com
    - export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0='*'
    # The checkouts are nobody's working copy: each run starts from exactly
    # what GitLab holds, whatever an interrupted run left (a version branch,
    # an unpushed bump, a propagated constraint).
    - |
      reset_to() {
        # Tags too, forced: the bump is measured from the last one, which an
        # older clone, or a tag moved since, would get wrong.
        git -C "$1" fetch --quiet --force --tags origin "$2"
        git -C "$1" checkout --quiet --force "$2"
        git -C "$1" reset --quiet --hard "origin/$2"
      }
      for triple in "$WEX_PATH $WEX_REPOSITORY main" "$SUITE_PATH $SUITE_REPOSITORY $SUITE_BRANCH"; do
        set -- $triple
        if [ ! -d "$1/.git" ]; then git clone --branch "$3" "$2" "$1"; fi
        reset_to "$1" "$3"
      done
      # The packages side by side, eight at a time, here in the shell and not by
      # `package::suite/sync --reset`: wex runs from these very checkouts, so
      # they must be current before any wex command does — an older sync would
      # not even know --reset.
      for package in "$SUITE_PATH"/packages/*/ "$SUITE_PATH"/wex/*/; do
        [ -d "$package.git" ] && printf '%s\0' "$package"
      done | xargs -0 -r -P 8 -I{} sh -c 'git -C "$1" fetch --quiet --force --tags origin main && git -C "$1" checkout --quiet --force main && git -C "$1" reset --quiet --hard origin/main' _ {}
      true
    # What .wex/local/env.yml holds on a developer's machine.
    - |
      for target in "$WEX_PATH" "$SUITE_PATH"; do
        mkdir -p "$target/.wex/local"
        {
          echo "APP_ENV: local"
          echo "LOCAL_VENV_PATH: $VENV_PATH"
          echo "PROGRAM_PUBLICATION_SOURCE_LIBRARY_PATH: $SUITE_PATH"
          echo "GITLAB_API_TOKEN: $GITLAB_API_TOKEN"
          echo "GITHUB_API_TOKEN: $GITHUB_API_TOKEN"
          echo "PIPY_TOKEN: $PIPY_TOKEN"
        } > "$target/.wex/local/env.yml"
      done
    # wex run from its sources reads its root .env.yml, as on a developer's machine.
    - |
      printf 'APP_ENV: local\nPROGRAM_PUBLICATION_SOURCE_LIBRARY_PATH: %s\n' "$SUITE_PATH" > "$WEX_PATH/.env.yml"
    # One venv for wex and the suite, the packages installed from their
    # checkouts (editable), as `bin/install-dev` sets a developer's up. Its
    # bin first on the PATH: the publication calls uv and pdm from there.
    - if [ ! -x "$VENV_PATH/bin/python" ]; then python3 -m venv "$VENV_PATH"; fi
    - export PATH="$VENV_PATH/bin:$PATH"
    # uv, not pip: the venv is kept from run to run, and uv sees what is
    # already installed in a second where pip reinstalled everything (106 s).
    - pip install --quiet --upgrade pip uv
    - uv pip install --quiet --index-strategy unsafe-best-match --python "$VENV_PATH/bin/python" -r "$WEX_PATH/requirements.txt"
    # The first run on a machine: no package checked out yet, so nothing for
    # the sync to read the group from. Every live repository of the group is
    # cloned once, where the suite's clone_location puts it.
    - |
      if [ -z "$(ls -A "$SUITE_PATH/packages" 2>/dev/null)" ]; then
        python3 - <<'PY'
      import fnmatch, json, os, subprocess, urllib.request
      api = "https://gitlab.wexample.com/api/v4/groups/wexample-python/projects"
      places = [("wex-*", "wex"), ("*", "packages")]
      page = 1
      while True:
          request = urllib.request.Request(f"{api}?per_page=100&page={page}&archived=false&include_subgroups=false", headers={"PRIVATE-TOKEN": os.environ["GITLAB_API_TOKEN"]})
          projects = json.load(urllib.request.urlopen(request))
          for project in projects:
              if project["path"] == "suite-manager" or project["empty_repo"]:
                  continue
              place = next(d for p, d in places if fnmatch.fnmatch(project["path"], p))
              target = os.path.join(os.environ["SUITE_PATH"], place, project["path"])
              if not os.path.isdir(target):
                  subprocess.run(["git", "clone", "--quiet", "--branch", "main", project["ssh_url_to_repo"], target], check=True)
          if len(projects) < 100:
              break
          page += 1
      PY
      fi
    # wex from its sources, also for the subcommands it starts through
    # .wex/bin/app-manager, which run CORE_BIN.
    - |
      printf '#!/bin/sh\nexec "%s/bin/python" "%s/__main__.py" "$@"\n' "$VENV_PATH" "$WEX_PATH" > /usr/local/bin/wex-src
      chmod +x /usr/local/bin/wex-src
    - export CORE_BIN=/usr/local/bin/wex-src
    # One command a line: in a `a && b` list, set -e lets a failing `a` go on.
    - cd "$SUITE_PATH"
    - wex-src package::suite/sync
    # Every package from its checkout with its dev extra (pytest…), in one
    # resolution: the suite's packages satisfy each other from their sources.
    - |
      set --
      for package in "$SUITE_PATH"/packages/*/ "$SUITE_PATH"/wex/*/; do
        set -- "$@" -e "${package%/}[dev]"
      done
      uv pip install --quiet --index-strategy unsafe-best-match --python "$VENV_PATH/bin/python" "$@"
    - cd "$WEX_PATH"
    - wex-src app::release/publish
