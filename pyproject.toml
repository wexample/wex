[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "wex"
version = "6.0.164"
description = "Runs infrastructure and Docker-backed apps from a single command line, resolving addon-provided commands under one shared grammar"
authors = [
    { name = "weeger", email = "contact@wexample.com" },
]
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]
dependencies = [
    "tomli",
    "wexample-wex-addon-ai>=19.1.7",
    "wexample-wex-addon-app>=34.12.0",
    "wexample-wex-addon-dev-css>=6.0.99",
    "wexample-wex-addon-dev-javascript>=8.12.0",
    "wexample-wex-addon-dev-php>=12.18.0",
    "wexample-wex-addon-dev-python>=15.6.1",
    "wexample-wex-addon-filestate>=6.2.30",
    "wexample-wex-addon-master>=11.5.7",
    "wexample-wex-addon-package>=7.11.5",
    "wexample-wex-addon-process>=5.1.8",
    "wexample-wex-addon-services-collab>=11.10.8",
    "wexample-wex-addon-services-db>=12.7.8",
    "wexample-wex-addon-services-monitoring>=7.11.8",
    "wexample-wex-addon-services-platform>=13.5.2",
    "wexample-wex-core>=31.4.1",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "MIT"

[project.urls]
homepage = "https://github.com/wexample/wex"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["wex.testing*"]

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"

[[tool.pdm.build.packages]]
include = "wex"
from = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--color=yes"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/.venv/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:", "@abstractmethod"]
