formatter: app-doc
sources: []
agents:
  author:
    instructions: |
      The page must carry a `## What the installer changes on your machine` section,
      placed right after the install commands and before `## Check Installation`.

      It lists every effect `bin/install` has outside the project directory, so a reader
      can tell what to expect and what `bin/uninstall` is supposed to undo. One bullet per
      effect, naming the exact path the script writes to.

      Nothing else on this page is yours: the install/uninstall commands and the check
      section already exist and are out of your scope.

    sources:
      - file: bin/install
      - file: bin/uninstall

  maintainer:
    instructions: |
      How a user installs, uninstalls and smoke-tests wex, in the exact commands they type.

      Covers only what the four scripts below do at the surface: what each one requires,
      what it changes on the machine, and how to check it worked. Their internals are not
      documented here — a refactor that keeps the same entry point and the same effect
      changes nothing on this page.

      Out of scope: configuration, usage of the `wex` command beyond `wex hi`, and any
      install path these four scripts do not implement.

    sources:
      - file: bin/install
      - file: bin/install-dev
      - file: bin/uninstall
      - file: bin/wex
